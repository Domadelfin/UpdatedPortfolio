<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon: a tilted yellow sticky note with a hand-drawn "D".
       Colors match the site: ink #2b2620, marker yellow #ffe17a. -->
  <g transform="rotate(-7 16 16)">
    <!-- offset shadow, like the cards' -->
    <path d="M6.6 6.2 L27.4 5.6 L27.9 26.6 L7 27.4 Z" fill="#2b2620" transform="translate(1.6 1.8)" />
    <!-- the note: slightly uneven edges, bottom-right corner folded -->
    <path
      d="M5.8 5.4 L26.6 4.9 L27 20.8 L21.2 26.7 L6.3 27.2 Z"
      fill="#ffe17a"
      stroke="#2b2620"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- the fold -->
    <path d="M27 20.8 L21.6 21.4 L21.2 26.7 Z" fill="#e8c95a" stroke="#2b2620" stroke-width="1.6" stroke-linejoin="round" />
    <!-- hand-drawn D: a stem, then one looping stroke for the bowl -->
    <path
      d="M11.6 9.6 C11.4 13.4 11.5 17.6 11.9 22 M10.6 10.1 C15.4 8.6 20.6 10.4 20.8 15.4 C21 19.8 17.2 22.6 11 22.2"
      fill="none"
      stroke="#2b2620"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
